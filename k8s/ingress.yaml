apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiot-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /api/v1/telemetry
        pathType: Prefix
        backend:
          service:
            name: aiot-service
            port:
              number: 8000
